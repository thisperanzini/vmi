# Site financiamento.sespartners.com.br: publica só a ferramenta de financiamento.
# O dist/ já vem montado pelo build.py e commitado; nada a construir no Netlify.
# Para o HDA, um segundo site no Netlify ligado a este repositório com publish = "dist/hda-viabilidade".
[build]
  publish = "dist/financiamento-vmi"
  command = ""

# Quem entrar pelo endereço *.netlify.app vai para o domínio próprio (necessário quando houver camada de login na frente).
[[redirects]]
  from = "https://silver-mandazi-edca86.netlify.app/*"
  to = "https://financiamento.sespartners.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
