# Site financiamento.sespartners.com.br: publica só a ferramenta de financiamento.
# O dist/ já vem montado pelo build.py e commitado; nada a construir no Netlify.
# Para o HDA, um segundo site no Netlify ligado a este repositório com publish = "dist/hda-viabilidade".
[build]
  publish = "dist/financiamento-vmi"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Porteiro: exige sessão (cookie assinado) em tudo, exceto a tela de entrada e as funções.
[[edge_functions]]
  path = "/*"
  function = "gate"
  excludedPath = ["/entrar", "/entrar/*", "/.netlify/*", "/favicon.ico", "/robots.txt"]

# Quem entrar pelo endereço *.netlify.app vai para o domínio próprio (senão a camada de login é contornada).
[[redirects]]
  from = "https://silver-mandazi-edca86.netlify.app/*"
  to = "https://financiamento.sespartners.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
