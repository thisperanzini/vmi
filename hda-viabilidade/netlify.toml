# Site projetohda.sespartners.com.br. No Netlify, este site usa Base directory = "hda-viabilidade";
# o publish abaixo é relativo à base. O dist/ já vem montado pelo build.py da raiz; nada a construir.
[build]
  publish = "dist"
  command = ""

# @netlify/blobs 11 pede Node 22.12+.
[build.environment]
  NODE_VERSION = "22"
  # ALLOW_DOMAINS (domínio do e-mail) e MAIL_FROM (remetente) não são segredos, mas o valor aparece nas páginas e no código;
  # sem isto o scanner de segredos do Netlify barra o deploy. SESSION_SECRET e RESEND_API_KEY seguem verificadas.
  SECRETS_SCAN_OMIT_KEYS = "ALLOW_DOMAINS,MAIL_FROM,SITE_NAME,SITE_ID,ADMIN_EMAILS"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Porteiro: exige sessão (cookie assinado) em tudo, exceto a tela de entrada e as funções.
[[edge_functions]]
  path = "/*"
  function = "gate"
  excludedPath = ["/entrar", "/entrar/*", "/.netlify/*", "/favicon.ico", "/robots.txt"]

# Quem entrar pelo endereço *.netlify.app vai para o domínio próprio (senão a camada de login é contornada).
[[redirects]]
  from = "https://serene-bubblegum-a5555b.netlify.app/*"
  to = "https://projetohda.sespartners.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
