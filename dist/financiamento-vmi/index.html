<style>
/* Layout: mesa de crédito da S&S — faixa azul-marinho com o caso ativo, abas por etapa da operação, cartões de decisão; números em mono tabular, dourado só no que pede decisão. */
:root {
  --navy: #1c2b4a; --gold: #b8923a; --gold-ink: #1c2b4a; --gold-soft: #f6efdd;
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #e9edf3; --line: #d3dae4; --line-2: #e4e9f0;
  --fg: #142035; --fg-2: #4d5b72; --fg-3: #84909f;
  --accent: #1c2b4a; --accent-ink: #ffffff; --accent-soft: #e3e9f3;
  --band: #1c2b4a; --band-fg: #eef2f8; --band-fg-2: #a9b6cc;
  --good: #1f7a3d; --good-soft: #e3f3e8; --warn: #9a6400; --warn-soft: #fbf0d9; --bad: #b42d2d; --bad-soft: #fbe6e6; --info: #2a63b8; --info-soft: #e4edfa;
  --s1: #1c2b4a; --s2: #b8923a; --s3: #2a7f8f; --s4: #84909f;
  --shadow: 0 1px 2px rgba(20, 32, 53, .06), 0 6px 18px rgba(20, 32, 53, .05);
  --font: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0b1220; --gold: #d8b45f; --gold-ink: #10182a; --gold-soft: #33290f;
    --bg: #0e1420; --surface: #151d2c; --surface-2: #1d2738; --line: #2c374b; --line-2: #233045;
    --fg: #e9eef6; --fg-2: #aab6c9; --fg-3: #75829a;
    --accent: #c9d6ee; --accent-ink: #10182a; --accent-soft: #1f2c45;
    --band: #0b1220; --band-fg: #eef2f8; --band-fg-2: #8e9bb2;
    --good: #4cc77a; --good-soft: #15301f; --warn: #e5ad45; --warn-soft: #33270f; --bad: #f07272; --bad-soft: #3a1c1f; --info: #78a7f0; --info-soft: #172a47;
    --s1: #c9d6ee; --s2: #d8b45f; --s3: #4fb3c4; --s4: #75829a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #0b1220; --gold: #d8b45f; --gold-ink: #10182a; --gold-soft: #33290f;
  --bg: #0e1420; --surface: #151d2c; --surface-2: #1d2738; --line: #2c374b; --line-2: #233045;
  --fg: #e9eef6; --fg-2: #aab6c9; --fg-3: #75829a;
  --accent: #c9d6ee; --accent-ink: #10182a; --accent-soft: #1f2c45;
  --band: #0b1220; --band-fg: #eef2f8; --band-fg-2: #8e9bb2;
  --good: #4cc77a; --good-soft: #15301f; --warn: #e5ad45; --warn-soft: #33270f; --bad: #f07272; --bad-soft: #3a1c1f; --info: #78a7f0; --info-soft: #172a47;
  --s1: #c9d6ee; --s2: #d8b45f; --s3: #4fb3c4; --s4: #75829a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }
h1, h2, h3 { font-family: var(--font-cond); font-weight: 600; letter-spacing: -.005em; margin: 0; text-wrap: balance; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
p { margin: 0; }
a { color: var(--info); }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.muted { color: var(--fg-2); } .small { font-size: 12px; } .tiny { font-size: 11.5px; color: var(--fg-3); }
.pos { color: var(--good); } .neg { color: var(--bad); }
[hidden] { display: none !important; }

/* faixa do caso */
.band { background: var(--band); color: var(--band-fg); margin-inline: -16px; padding-inline: 16px; }
.band-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding-block: 12px; }
.mark { display: flex; align-items: center; gap: 14px; flex: 1 1 280px; min-width: 0; }
.mark .logo { height: 44px; width: auto; display: block; flex: none; }
.mark .ss { font: 700 20px/1 var(--font-cond); letter-spacing: .01em; color: #fff; white-space: nowrap; }
.mark .ss b { color: var(--gold); font-weight: 700; }
.mark .what { font-size: 12.5px; color: var(--band-fg-2); }
.casepick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.casepick select { width: auto; min-width: 200px; background: rgba(255,255,255,.08); color: var(--band-fg); border-color: rgba(255,255,255,.18); max-width: 320px; }
.casepick select option { color: #142035; }
.sync { font-size: 12px; color: var(--band-fg-2); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--band-fg-2); flex: none; }
.dot.ok { background: #4cc77a; } .dot.dirty { background: var(--gold); } .dot.local { background: #78a7f0; }
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--fg-2); font: 500 13.5px var(--font); padding: 11px 12px; cursor: pointer; white-space: nowrap; border-radius: 0; display: inline-flex; gap: 6px; align-items: center; }
.tab .st { font: 500 10.5px var(--mono); color: var(--fg-3); }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); font-weight: 600; }
.tab.sep { margin-left: 10px; border-left: 1px solid var(--line); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* controles */
button { font: 500 13px var(--font); border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--fg-3); }
button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } }
button.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
button.ghost { background: transparent; } button.danger { color: var(--bad); }
button.sm { padding: 4px 9px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: 400 13px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
input.n { text-align: right; font-family: var(--mono); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--navy); }
input[type=range] { accent-color: var(--gold); padding: 0; border: 0; background: transparent; }
textarea { min-height: 70px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-2); min-width: 0; }
label.f .h { font-size: 11px; color: var(--fg-3); }
label.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--fg); }
label.chk input { margin-top: 2px; flex: none; }

/* blocos */
main { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
section[role=tabpanel] { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.form .w2 { grid-column: span 2; } @media (max-width: 520px) { .form .w2 { grid-column: auto; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--fg-2); font-weight: 500; }
.kpi .v { font: 500 22px/1.15 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .v.s { font-size: 17px; }
.kpi .sub { font-size: 11.5px; color: var(--fg-3); }
.kpi.hl { border-color: var(--gold); background: var(--gold-soft); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.notice { border-left: 3px solid var(--info); background: var(--info-soft); padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 13px; }
.notice.warn { border-left-color: var(--warn); background: var(--warn-soft); } .notice.bad { border-left-color: var(--bad); background: var(--bad-soft); } .notice.good { border-left-color: var(--good); background: var(--good-soft); }
ul.lst { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
ul.lst li { max-width: 90ch; }
details > summary { cursor: pointer; color: var(--fg-2); font-size: 13px; font-weight: 500; }
details[open] > summary { margin-bottom: 8px; }
.formula { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* tabelas */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.tot td { font-weight: 600; background: var(--surface-2); }
tr.cat td { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-2); font-weight: 600; background: var(--surface-2); }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }

/* linhas */
.linha { display: grid; grid-template-columns: 54px minmax(0, 1fr) minmax(220px, 300px); gap: 14px; padding: 16px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.linha.top { border: 1.5px solid var(--gold); }
@media (max-width: 820px) { .linha { grid-template-columns: 44px minmax(0, 1fr); } .linha .rt { grid-column: 1 / -1; } }
.rank { font: 700 26px/1 var(--font-cond); color: var(--fg-3); }
.linha.top .rank { color: var(--gold); }
.linha .nm { font: 600 16px/1.25 var(--font-cond); }
.linha .op { font-size: 12px; color: var(--fg-2); }
.linha .rt { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.linha .big { font: 500 26px/1 var(--mono); letter-spacing: -.02em; }
.comp { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
.comp span { background: var(--surface-2); border-radius: 4px; padding: 2px 6px; }
.why { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 8px; }
.why h4 { margin: 0 0 4px; font: 600 11px var(--font); letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }
.src { font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.bar { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--gold); opacity: .55; }
.bar b { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--fg); border-radius: 2px; }

/* kit */
.prog { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--good); }
.kit-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) 170px; gap: 10px 14px; padding: 12px 0; border-bottom: 1px solid var(--line-2); align-items: start; }
.kit-item:last-child { border-bottom: 0; }
@media (max-width: 680px) { .kit-item { grid-template-columns: 34px minmax(0, 1fr); } .kit-item .ks { grid-column: 2; } }
.kit-item .kn { font: 600 13px var(--mono); color: var(--fg-3); padding-top: 2px; }
.kit-item .kt { font-weight: 600; font-size: 13.5px; }
.kit-item .km { font-size: 12px; color: var(--fg-2); }
.kit-item .ks { display: flex; flex-direction: column; gap: 6px; }
.ex { margin-top: 8px; border: 1px solid var(--line-2); border-radius: 6px; padding: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.ex dl { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
.ex dt { color: var(--fg-2); } .ex dd { margin: 0; overflow-wrap: anywhere; }
.drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 8px; text-align: center; font-size: 12px; color: var(--fg-2); cursor: pointer; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }

/* gráficos */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg-2); font-family: var(--mono); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.out { display: flex; flex-direction: column; gap: 10px; }
.out h3 { font-size: 16px; }
.modal { position: fixed; inset: 0; background: rgba(10, 16, 28, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
.modal .box { background: var(--surface); border-radius: 10px; max-width: 640px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 70; max-width: calc(100vw - 32px); }
footer { color: var(--fg-3); font-size: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }
.empty { text-align: center; padding: 28px 12px; color: var(--fg-2); }
@media (prefers-reduced-motion: no-preference) { .kpi, .linha { transition: border-color .15s; } }
@media (max-width: 640px) { .kpi .v { font-size: 19px; } .linha .big { font-size: 22px; } }
</style>

  /* Taxa nominal anual composta: (1+CF)×Π(1+spread)−1 */

  /* IOF-crédito PJ: 0,0082% ao dia sobre cada amortização de principal (até 365 dias) + 0,38% fixo */

  /* Simula uma linha para um custo e cenário. */

    if (c.carencia != null && car > c.carencia) { avisos.push("Carência reduzida ao máximo da linha (" + c.carencia + " meses)"); car = c.carencia; }
    /* Limites do custo financeiro (ex.: TFB 120/12, Taxa LCD 120/24): o que a linha permite, mas o custo não. */

    /* ---------- painel: método ---------- */
    metodo: function () {
      return '<div class="card stack"><h2>Como a ferramenta decide</h2><p class="muted" style="max-width:80ch">A IA só lê documentos. Elegibilidade, ranking, taxas, cronograma, CET e ROI saem de regras fixas e fórmulas abertas abaixo: o mesmo caso sempre dá o mesmo resultado, e cada número aponta para a fonte.</p></div>' +
        '<div class="card stack"><h3>Dois modos de ROI e a visão da entidade (desde 14/10/2026)</h3><p class="small muted" style="max-width:90ch"><b>Novo serviço:</b> volume = capacidade × ocupação × rampa; receita = volume × ticket ponderado pelo mix. <b>Internalização:</b> ganho = EBITDA próprio − EBITDA atual sobre a mesma receita; custos fixos já pagos não entram; Presumido e Simples tributam a receita (imposto incremental zero), Lucro Real tributa 34% do EBIT incremental. <b>Filantrópica:</b> IR/CSLL e PIS/COFINS imunes nos dois modos; só o ISS, conforme o município. <b>Entidade:</b> DSCR ano a ano = (EBITDA do tomador + ganho do projeto líquido de IR) ÷ (parcelas das dívidas existentes + parcela nova), com e sem o evento de desalavancagem; dívida líquida/EBITDA antes e depois da operação.</p></div>' +
        '<div class="grid g2"><div class="card stack"><h3>1. Elegibilidade</h3><ul class="lst small"><li>Natureza jurídica (privada ou filantrópica) e porte pela receita bruta anual do grupo (BNDES: micro até R$ 360 mil; pequena até R$ 4,8 mi; média até R$ 300 mi).</li><li>UF na área de atuação (fundos constitucionais e agências estaduais). Norte de MG/ES entra no FNE só se marcado como área da Sudene.</li><li>Equipamento: linhas BNDES exigem código CFI (bem novo, nacional, credenciado). Importado só onde a linha prevê.</li><li>Valor mínimo e máximo; condições comprováveis marcadas no caso (Mais Inovação, projeto de inovação, filantrópica SUS).</li><li>FIIS Saúde: só para proponentes da Chamada Pública 2025 (marcado no caso), com enquadramento (filantrópica com CEBAS, OS, SPE ou Agora Tem Especialistas: até 20 anos; privada com contrato SUS: até 10 anos). Indireto até R$ 50 mi e direto a partir de R$ 20 mi, sobre a soma das propostas do proponente.</li><li>Linhas encerradas e sem taxa publicada não entram no ranking.</li></ul></div>' +
        '<div class="card stack"><h3>2. Taxa de cada linha</h3><div class="formula">taxa a.a. = (1 + custo financeiro) × (1 + Taxa do BNDES) × (1 + taxa do agente) − 1\nTLP = (1 + IPCA do ano, Focus) × (1 + Jm) − 1, com Jm fixo no contrato\nfundos constitucionais: TFC pré do porte, sem spread\nTFB = taxa do vértice do prazo (36, 60, 84 ou 120 meses), liberação em 30 dias (90 no máximo)\nTaxa LCD = (1 + Selic do ano, Focus) × (1 + sobretaxa LCD) − 1\nFIIS = taxa fixa total por prazo, interpolada entre 10 e 20 anos\nmensal = (1 + taxa a.a.)^(1/12) − 1</div><p class="small muted">A taxa do agente não tem referência oficial; a faixa usada vem das operações de saúde contratadas e publicadas nos dados abertos do BNDES (p25, mediana e p75), por custo financeiro. Quando a linha aceita mais de um custo financeiro (BNDES Automático: TFB, TLP, Taxa LCD, Pré FAT e, para MPME, Pré FAT MPME), o motor simula todos com a Taxa do BNDES do porte, mostra o mínimo e o máximo entre eles e escolhe o de menor custo total que cumpre o prazo e a carência pedidos (TFB: até 120/12 meses; Taxa LCD: até 120/24).</p></div>' +
        '<div class="card stack"><h3>3. Cronograma, IOF e CET</h3><ul class="lst small"><li>SAC: amortização constante após a carência. Price: parcela recalculada pelo saldo e pela taxa do mês.</li><li>Carência: juros pagos mês a mês ou capitalizados no saldo.</li><li>IOF PJ: 0,0082% ao dia sobre cada amortização (até 365 dias) + 0,38% sobre o valor; zero no FINAME (art. 8º, IX) e nos fundos constitucionais; não incide no leasing.</li><li>CET do agente = TIR mensal anualizada de: valor liberado − IOF − tarifas, menos as parcelas. Custo total = mesma conta, descontando também o honorário de êxito.</li></ul></div>' +
        '<div class="card stack"><h3>4. ROI e payback</h3><ul class="lst small"><li>Volume = exames/hora × horas × dias × ocupação × rampa; receita = volume × ticket ponderado pelo mix × (1 − glosa).</li><li>EBITDA = receita − tributos sobre a receita − laudo − insumos − manutenção (após a garantia) − fixos.</li><li>Fluxo do acionista = EBITDA − IR/CSLL − parcela; no mês zero, entrada + IOF + tarifas + honorário.</li><li>TIR e VPL mensais anualizados; payback no mês em que o acumulado vira positivo; DSCR = (EBITDA − IR) ÷ serviço da dívida no ano.</li></ul></div></div>' +

      return Promise.resolve();
    }
    return S.downloads.save({ filename: nome, data: blob }).then(function (r) { toast(r && r.status === "delivered" ? "Arquivo entregue." : "Arquivo salvo."); })
      .catch(function (e) { toast(e && e.code === "declined" ? "Download cancelado." : "Não foi possível salvar o arquivo (" + (e && e.code) + ")."); });
  }
  function slug(s) { return String(s || "caso").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40); }
  function pacote(c) { return { caso: c, av: S.av, sim: S.simAtual, roi: S.roiAtual, ent: S.entAtual, base: S.base, kitProg: kitProg(c), hoje: hoje(), indic: ((c.financeiro || {}).exercicios || []).map(function (e) { return { ano: e.ano, i: M.indicadores(e) }; }) }; }
  function gerar(doc, c) {
    if (doc === "contrato") {
      modal('<h2>Dados do representante para a minuta</h2><p class="small muted">Usados só neste arquivo; não ficam salvos na ferramenta.</p><div class="form">' +
        '<label class="f" for="m_qualif">Nacionalidade, estado civil, profissão<input id="m_qualif" value="' + esc((c.cliente.rep || {}).qualif || "brasileiro, [estado civil], médico") + '"></label><label class="f" for="m_rg">RG e órgão emissor<input id="m_rg" value=""></label><label class="f" for="m_cpf">CPF<input id="m_cpf" value=""></label><label class="f" for="m_data">Data de assinatura<input id="m_data" type="date" value=""></label>' +
        '<label class="f w2" for="m_linha">Linha objeto do contrato<select id="m_linha"><option value="BNDES FINAME">BNDES FINAME</option><option value="BNDES Automático">BNDES Automático</option><option value="' + esc(S.simAtual ? S.simAtual.linha.nome : "") + '">' + esc(S.simAtual ? S.simAtual.linha.nome : "Linha simulada") + "</option></select></label></div>" +
        '<div class="row end"><button data-act="fechar">Cancelar</button><button class="primary" data-act="contrato-ok">Gerar minuta</button></div>');
      return;
    }
    toast("Gerando…");
    var p = pacote(c);
    if (doc === "estudo" || doc === "dossie") {
      carregar(LIB.jspdf).then(function () { return carregar(LIB.at); }).then(function () {
        var pdf = doc === "estudo" ? Docs.estudo(p, window.jspdf.jsPDF) : Docs.dossie(p, window.jspdf.jsPDF);
        return salvarArquivo((doc === "estudo" ? "Estudo_Financiamento_" : "Dossie_Agente_") + slug(c.cliente.fantasia || c.nome) + ".pdf", pdf.output("blob"));
      }).catch(function (e) { toast("Falha ao gerar o PDF: " + (e && e.message)); });
    } else if (doc === "kit") {
      carregar(LIB.xl).then(function () { return Docs.kit(p, window.ExcelJS); }).then(function (buf) { return salvarArquivo("Kit_Documentos_FINAME_" + slug(c.cliente.fantasia || c.nome) + ".xlsx", new Blob([buf])); })
        .catch(function (e) { toast("Falha ao gerar a planilha: " + (e && e.message)); });
    }
  }
  function gerarContrato(c, rep) {
    toast("Gerando…");
    carregar(LIB.docx).then(function () { return Docs.contrato(pacote(c), rep, window.docx); }).then(function (blob) { return salvarArquivo("Contrato_FINAME_" + slug(c.cliente.fantasia || c.nome) + "_VMI.docx", blob); })
      .catch(function (e) { toast("Falha ao gerar a minuta: " + (e && e.message)); });
  }

  /* ---------- início ---------- */
  $("#logoTopo").src = LOGO.branco;
  try { var t = localStorage.getItem("vmi_tab"); if (t) S.tab = t; } catch (e) {}
  registrarUso("pagina");
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  document.addEventListener("click", onClick);
  $("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") fechar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#modal").hidden) fechar(); });
  document.addEventListener("dragover", function (e) { var d = e.target.closest && e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  document.addEventListener("dragleave", function (e) { var d = e.target.closest && e.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", function (e) { var d = e.target.closest && e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.classList.remove("over"); var f = e.dataTransfer.files[0]; if (f) lerArquivo(d.dataset.drop, f); } });
  $("#btnNovo").addEventListener("click", function () { var n = casoNovo(); S.casos[n.id] = n; S.atual = n.id; S.tab = "cliente"; salvar(n); renderTudo(); });
  renderTudo();
  conectar();
})();
</script>
</body>
</html>
